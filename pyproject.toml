[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-screen-companion"
version = "1.0.0"
description = "Real-time AI quota dashboard (Claude Code, OpenAI Codex, Google Antigravity) for mini desktop screens."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "TechSentinel", email = "ops@techsentinel.fr" }
]
keywords = ["geekmagic", "ai-quotas", "claude-code", "openai-codex", "esp8266", "desktop-screen", "monitor"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "pillow>=9.5.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
mini-screen = "mini_screen_companion.cli:main"
ai-screen = "mini_screen_companion.cli:main"

[project.urls]
Homepage = "https://github.com/TechSentinel-fr/mini-screen-companion"
Repository = "https://github.com/TechSentinel-fr/mini-screen-companion"
Issues = "https://github.com/TechSentinel-fr/mini-screen-companion/issues"

[tool.setuptools.packages.find]
where = ["src"]
