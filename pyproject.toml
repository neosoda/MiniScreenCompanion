[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "turing-35-companion"
version = "2.0.0"
description = "Real-time PC telemetry & AI quota cockpit dashboard for Turing 3.5\" IPS Smart Screen (USB-C Rev A)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "TechSentinel", email = "ops@techsentinel.fr" }
]
keywords = ["turing-smart-screen", "turing-35", "cockpit", "telemetry", "ai-quotas", "nvml", "hardware-monitor"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "pyserial>=3.5",
    "pillow>=10.0.0",
    "numpy>=1.24.0",
    "psutil>=5.9.0",
    "pywin32>=306",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
turing-companion = "run:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
